[project]
name = "url-extract"
version = "2.5.2"
description = "通用内容精华抽取 — 把 B 站视频、GitHub 仓库、一般网页、微视链接变成结构化 Markdown，可选上传到 IMA 知识库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wahero" }]
keywords = ["skill", "extract", "markdown", "bilibili", "github", "defuddle", "ima"]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.scripts]
url-extract = "extract:main"

[tool.setuptools]
py-modules = ["extract", "ima_client"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
